name: Build APK

# Chaque push sur main compile l'APK, l'expose en artifact et publie la release
# "v<version>" que l'application interroge via /releases/latest.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

env:
  # Mode recommandé : phrase secrète choisie par le propriétaire du dépôt, dont
  # la clé de signature est dérivée (aucun fichier à transférer).
  SIGNING_PASSPHRASE: ${{ secrets.ANDROID_SIGNING_PASSPHRASE }}
  # Mode alternatif : keystore existant fourni en base64 (priorité plus basse).
  KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lire la version de pubspec.yaml
        id: version
        run: |
          set -eu
          VERSION=$(sed -n 's/^version: *//p' pubspec.yaml | head -n1 | cut -d'+' -f1)
          if [ -z "$VERSION" ]; then
            echo "Version introuvable dans pubspec.yaml" >&2
            exit 1
          fi
          echo "name=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "Version publiée : $VERSION"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Dépendances
        run: flutter pub get

      - name: Analyse statique
        run: flutter analyze

      - name: Tests
        run: flutter test

      - name: Préparer la signature de release
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: bash scripts/prepare-signing.sh

      - name: Enregistrer le certificat de signature
        run: |
          set -eu
          CERT=certs/release-signing-cert.pem
          if [ ! -f "$CERT" ]; then
            echo "::error::Certificat de signature absent : impossible de garantir une identité stable." >&2
            exit 1
          fi
          if [ -z "$(git status --porcelain -- "$CERT")" ]; then
            echo "Certificat déjà versionné : $(openssl x509 -in "$CERT" -noout -fingerprint -sha256)."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$CERT"
          git commit -m "Enregistre le certificat de signature de release"
          for essai in 1 2 3; do
            if git push; then
              echo "Certificat poussé sur la branche : les prochains builds réutiliseront la même identité."
              exit 0
            fi
            git pull --rebase --autostash || true
          done
          echo "::error::Impossible de versionner le certificat : un APK publié sans certificat enregistré casserait les mises à jour suivantes." >&2
          exit 1

      - name: Construire l'APK
        run: |
          flutter build apk --release \
            --build-name "${{ steps.version.outputs.name }}"

      - name: Empaqueter l'APK
        id: package
        run: |
          set -eu
          OUT="world_ai-${{ steps.version.outputs.name }}.apk"
          cp build/app/outputs/flutter-apk/app-release.apk "$OUT"
          sha256sum "$OUT" > "$OUT.sha256"
          cat "$OUT.sha256"
          echo "path=$OUT" >> "$GITHUB_OUTPUT"

      - name: Publier l'artifact
        uses: actions/upload-artifact@v4
        with:
          name: world_ai-${{ steps.version.outputs.name }}-apk
          path: |
            ${{ steps.package.outputs.path }}
            ${{ steps.package.outputs.path }}.sha256
          if-no-files-found: error
          retention-days: 90

      - name: Créer ou mettre à jour la release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
          APK: ${{ steps.package.outputs.path }}
          VERSION: ${{ steps.version.outputs.name }}
        run: |
          set -eu
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG déjà publiée : remplacement de l'APK."
            gh release upload "$TAG" "$APK" "$APK.sha256" --clobber
          else
            echo "Création de la release $TAG."
            gh release create "$TAG" "$APK" "$APK.sha256" \
              --title "WORLD-AI $VERSION" \
              --generate-notes
          fi
